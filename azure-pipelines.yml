# FlipLeo Database: build the SQL project into a .dacpac on every push; publish it to Azure SQL from main.
# The publish compares the dacpac with the live database and applies only the differences, then runs
# Script.PostDeployment.sql (lookup seed data). It stops instead of dropping data (BlockOnPossibleDataLoss).
# Setup: see "FlipLeo Go-Live Guide.docx".

trigger:
  branches:
    include: [ main, develop ]

pr:
  branches:
    include: [ main, develop ]

variables:
  - group: flipleo-production           # Key Vault-linked: SqlAdminLogin, SqlAdminPassword
  - name: azureSubscription
    value: flipleo-azure
  - name: sqlServerName
    value: flipleo-sql                  # Azure SQL logical server name (without .database.windows.net)
  - name: sqlDatabaseName
    value: FlipLeo

stages:
  - stage: Build
    jobs:
      - job: Build
        pool:
          vmImage: windows-latest       # the dacpac deploy task needs Windows
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 9 SDK
            inputs:
              packageType: sdk
              version: 9.0.x

          - script: >
              dotnet build FlipLeo.Database/FlipLeo.Database.sqlproj
              --configuration Release
              --output $(Build.ArtifactStagingDirectory)/dacpac
            displayName: Build dacpac

          - task: PublishPipelineArtifact@1
            displayName: Upload dacpac
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/dacpac
              artifact: dacpac

  - stage: Deploy
    displayName: Deploy to production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDatabase
        environment: flipleo-production
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SqlAzureDacpacDeployment@1
                  displayName: Publish dacpac to Azure SQL
                  inputs:
                    azureSubscription: $(azureSubscription)
                    AuthenticationType: server
                    ServerName: $(sqlServerName).database.windows.net
                    DatabaseName: $(sqlDatabaseName)
                    SqlUsername: $(SqlAdminLogin)
                    SqlPassword: $(SqlAdminPassword)
                    deployType: DacpacTask
                    DeploymentAction: Publish
                    DacpacFile: $(Pipeline.Workspace)/dacpac/FlipLeo.Database.dacpac
                    # The project targets SQL Server 2022; Azure SQL supports everything it uses.
                    AdditionalArguments: /p:BlockOnPossibleDataLoss=true /p:AllowIncompatiblePlatform=true
                    IpDetectionMethod: AutoDetect   # temporary firewall rule for the build agent
                    DeleteFirewallRule: true
